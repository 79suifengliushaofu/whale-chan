# 打一个 v* 的 tag，这个工作流会：
#   ① 跑四个自检、打包 vsix
#   ② 建 GitHub Release，并把 .vsix 挂上去（**这一步永远会跑**）
#   ③ 看仓库里配了什么，能发哪个渠道就发哪个
#
# 怎么开某个渠道：
#   npm       —— 在 npmjs.com 上把本仓库登记成 Trusted Publisher（OIDC 受信发布，不需要 token），
#                再把仓库变量 NPM_PUBLISH 设成 on。
#     · 2027-01 起 npm 会取消「绕过 2FA 的 token 直接发布」，官方指定替代就是 OIDC 受信发布 ——
#       所以这条路是往前看的，不是权宜之计。
#   Open VSX  —— 在仓库 Secrets 里放 OVSX_PAT（open-vsx.org 的 token）。
#   Microsoft Marketplace —— **本仓库不用**：建 Azure DevOps 组织必须绑 Azure 订阅，
#                没有订阅就开不出 PAT。想要的话自己加一步 vsce publish + VSCE_PAT。
#
# 用 shell 的 if 判断而不是 YAML 的 if，是因为 secrets 那个上下文在 step 级 if 里
# 并不总是可用 —— 会表现为「整条 run 一个 job 都没有」，排查起来很费劲。

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 建 Release
      id-token: write   # npm 的 OIDC 受信发布

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: 版本号必须跟 tag 对得上
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./whale-chan/package.json').version")
          test "$TAG" = "$PKG" || { echo "tag $TAG != package.json $PKG"; exit 1; }

      - name: 跑自检
        run: |
          node tools/selfcheck.mjs
          node tools/memory-check.mjs
          node tools/card-check.mjs
          node tools/account-check.mjs

      - name: 打包 vsix
        run: node tools/build-vsix.mjs

      # 先把 Release 建出来 —— 就算后面某个商店发失败了，包也已经能下载了。
      - name: 建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: whale-chan-dist/whale-chan-terminal-*.vsix
          generate_release_notes: true

      - name: 发到 Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::没配 OVSX_PAT，跳过 Open VSX"
            exit 0
          fi
          npx --yes ovsx publish whale-chan-dist/whale-chan-terminal-*.vsix

      - name: 发到 npm
        working-directory: whale-chan
        env:
          NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}
        run: |
          if [ "$NPM_PUBLISH" != "on" ]; then
            echo "::notice::NPM_PUBLISH 不是 on，跳过 npm"
            exit 0
          fi
          npm publish --provenance --access public
