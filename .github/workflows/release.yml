# 打一个 v* 的 tag，这个工作流会把三样东西一起发出去：
#   ① VS Code Marketplace（vsce）  ② Open VSX（ovsx）  ③ npm（OIDC 受信发布，带 provenance）
#
# 需要先在仓库 Settings ▸ Secrets and variables ▸ Actions 里放两个 secret：
#   VSCE_PAT   —— Azure DevOps 的 Personal Access Token（scope 勾 Marketplace: Manage）
#   OVSX_PAT   —— open-vsx.org 的 token（`ovsx create-namespace <publisher>` 之后拿）
# npm 那一步**不需要 secret**：它用 GitHub 的 OIDC 身份，第一次发布前要在
# npmjs.com 的包设置里把本仓库登记成 Trusted Publisher。

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 建 Release
      id-token: write   # npm 的 OIDC 受信发布

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: 版本号必须跟 tag 对得上
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./whale-chan/package.json').version")
          test "$TAG" = "$PKG" || { echo "tag $TAG != package.json $PKG"; exit 1; }

      - name: 跑自检
        run: |
          node tools/selfcheck.mjs
          node tools/memory-check.mjs
          node tools/card-check.mjs
          node tools/account-check.mjs

      - name: 打包 vsix
        run: node tools/build-vsix.mjs

      - name: 发到 VS Code Marketplace
        run: npx --yes @vscode/vsce publish --packagePath whale-chan-dist/whale-chan-terminal-*.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: 发到 Open VSX
        run: npx --yes ovsx publish whale-chan-dist/whale-chan-terminal-*.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: 发到 npm
        working-directory: whale-chan
        run: npm publish --provenance --access public

      - name: 建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: whale-chan-dist/whale-chan-terminal-*.vsix
          generate_release_notes: true
